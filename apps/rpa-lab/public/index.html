<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ログイン | Altair 受注管理（RPA練習用）</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="login-wrap">
  <div class="login-card">
    <div class="brandline">
      <span class="mark">A</span>
      <h1>Altair 受注管理</h1>
    </div>
    <p class="sub">RPA 練習用のダミーシステムです</p>

    <div class="notice" id="expired" hidden data-testid="expired-notice">
      セッションの有効期限が切れました。再度ログインしてください。
    </div>
    <div class="alert" id="error" hidden data-testid="login-error"></div>

    <form id="form" novalidate>
      <label class="field">
        <span>メールアドレス<i class="req">*</i></span>
        <input type="email" id="email" name="email" autocomplete="username"
               data-testid="email" required>
      </label>
      <label class="field">
        <span>パスワード<i class="req">*</i></span>
        <input type="password" id="password" name="password" autocomplete="current-password"
               data-testid="password" required>
      </label>
      <button class="btn" type="submit" style="width:100%" data-testid="login-submit">ログイン</button>
    </form>

    <div class="demo-creds">
      練習用アカウント
      <table>
        <tr><td>営業</td><td>tanaka@altair.example.co.jp</td></tr>
        <tr><td>承認者</td><td>okochi@altair.example.co.jp</td></tr>
      </table>
      <p style="margin:8px 0 0">
        パスワードの既定値は <code>demo</code>（両アカウント共通）。
        環境変数 <code>RPA_SALES_PASSWORD</code> / <code>RPA_APPROVER_PASSWORD</code> で変更できます。
      </p>
      <p style="margin:8px 0 0">5回続けて失敗すると 60 秒ロックされます。セッションは 30 分で切れます。</p>
    </div>
  </div>
</main>

<script type="module">
import { api, $ } from '/assets/app.js';

if (new URLSearchParams(location.search).has('expired')) {
  $('#expired').hidden = false;
}

// すでにログイン済みならダッシュボードへ
api('/api/auth').then(() => { location.href = '/dashboard'; }).catch(() => {});

const form = $('#form');
const errorBox = $('#error');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.hidden = true;
  const btn = $('[data-testid=login-submit]');
  const email = $('#email').value.trim();
  const password = $('#password').value;

  if (!email || !password) {
    errorBox.textContent = 'メールアドレスとパスワードを入力してください。';
    errorBox.hidden = false;
    return;
  }

  btn.disabled = true;
  btn.textContent = 'ログイン中…';
  try {
    await api('/api/auth', { method: 'POST', body: { email, password } });
    location.href = '/dashboard';
  } catch (err) {
    errorBox.textContent = err.message || 'ログインに失敗しました。';
    errorBox.hidden = false;
    btn.disabled = false;
    btn.textContent = 'ログイン';
  }
});
</script>
</body>
</html>
