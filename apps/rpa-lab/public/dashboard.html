<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ダッシュボード | Altair 受注管理（RPA練習用）</title>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<main class="page">
  <h1>ダッシュボード</h1>
  <p class="crumb">ホーム</p>

  <div class="grid cols4" id="stats" data-testid="stats">
    <div class="panel skeleton"><div class="bar"></div><div class="bar"></div></div>
    <div class="panel skeleton"><div class="bar"></div><div class="bar"></div></div>
    <div class="panel skeleton"><div class="bar"></div><div class="bar"></div></div>
    <div class="panel skeleton"><div class="bar"></div><div class="bar"></div></div>
  </div>

  <div class="panel" style="margin-top:16px">
    <div class="panel-head">
      <h2>売上上位の顧客</h2>
      <span class="spacer"></span>
      <a class="btn secondary sm" href="/orders">受注一覧へ</a>
    </div>
    <div class="table-wrap">
      <table data-testid="top-customers">
        <thead><tr><th>顧客名</th><th style="text-align:right">受注金額計</th></tr></thead>
        <tbody id="top"><tr><td colspan="2" class="skeleton"><div class="bar"></div><div class="bar"></div><div class="bar"></div></td></tr></tbody>
      </table>
    </div>
  </div>
</main>

<script type="module">
import { boot, api, yen, $ } from '/assets/app.js';

await boot('/dashboard');
const meta = await api('/api/meta');
const s = meta.summary;

$('#stats').innerHTML = [
  ['受注件数', s.total, '件'],
  ['受注金額計', '¥' + s.totalAmount.toLocaleString('ja-JP'), ''],
  ['承認待ち', s.pending, '件'],
  ['差戻し', s.returned, '件'],
].map(([k, v, u], i) =>
  `<dl class="stat" data-testid="stat-${i}"><dt>${k}</dt><dd>${v}${u ? `<span>${u}</span>` : ''}</dd></dl>`
).join('');

$('#top').innerHTML = s.topCustomers
  .map((c) => `<tr><td>${c.name}</td><td class="num">${yen(c.amount)}</td></tr>`)
  .join('');
</script>
</body>
</html>
